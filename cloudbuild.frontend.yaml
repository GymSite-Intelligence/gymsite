# Build + deploy do gymsite-frontend (Cloud Run) a partir de frontend/Dockerfile.
# Usado por um trigger Cloud Build em ^main$ com includedFiles=frontend/** — assim
# um commit que toca frontend/ sobe o front automaticamente (o trigger gymsite-api
# só cobre o backend). Receita: build clássico (manifest Docker v2) + deploy por tag.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gymsite-frontend:$SHORT_SHA
      - -f
      - frontend/Dockerfile
      # Build-time env do Vite (publishable NÃO é segredo). Garante bundle com key
      # correta mesmo no checkout limpo do trigger (frontend/.env.production é gitignored).
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}
      - --build-arg
      - VITE_API_BASE=${_VITE_API_BASE}
      - frontend
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gymsite-frontend:$SHORT_SHA
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gymsite-frontend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gymsite-frontend:$SHORT_SHA
      - --region=us-central1
      - --quiet
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gymsite-frontend:$SHORT_SHA
substitutions:
  _VITE_SUPABASE_URL: https://epgedaiukjippepujuzc.supabase.co
  _VITE_SUPABASE_ANON_KEY: sb_publishable_fj4Ioi3YX8gI-h3lrcb45w_FZa9UzhD
  _VITE_API_BASE: https://gymsite-api.vectracargo.com.br
options:
  logging: CLOUD_LOGGING_ONLY
