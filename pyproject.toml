[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gymsite-intelligence"
version = "0.1.0"
description = "GymSite Intelligence — Pipeline de viabilidade e relatórios para academias"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "googlemaps>=4.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "supabase>=2.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "tinker",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyrefly>=0.46",
]

[tool.setuptools]
py-modules = []

# Só se alguém rodar `vercel` local — API prod = Hetzner, não Vercel.
# Ver .agent/workflows/deploy.md
[tool.vercel]
entrypoint = "api:app"
