tunnel: 12675577-d94b-4a19-b1df-a86713dbaf80
credentials-file: /etc/cloudflared/credentials.json

# Força HTTP/2 ao invés de QUIC (mais estável em redes com NAT/instabilidade)
protocol: http2
no-autoupdate: true

ingress:
  - hostname: api.vectracargo.com.br
    service: http://gymsite-api:8000
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      http2Origin: false
      noTLSVerify: true
      # Tenta origin via IP interno Docker se DNS falhar
      originServerName: gymsite-api

  - hostname: gymsite-api.vectracargo.com.br
    service: http://gymsite-api:8000
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      http2Origin: false
      noTLSVerify: true
      originServerName: gymsite-api

  # Staging Hetzner — validar HTTPS ANTES do cutover DNS de produção
  # (PLAN_HETZNER_VPS_TUNNEL §8 decisão 3A). Criar rota DNS do túnel:
  #   cloudflared tunnel route dns <TUNNEL_ID> api-hetzner.getgymsite.com.br
  - hostname: api-hetzner.getgymsite.com.br
    service: http://gymsite-api:8000
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      http2Origin: false
      noTLSVerify: true
      originServerName: gymsite-api

  # Canônico do produto — cutover Hetzner (PLAN_HETZNER_VPS_TUNNEL §2). Requer
  # rota DNS do túnel para este hostname além do ingress.
  - hostname: api.getgymsite.com.br
    service: http://gymsite-api:8000
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      http2Origin: false
      noTLSVerify: true
      originServerName: gymsite-api

  # Uptime Kuma — painel status (sem porta host). DNS do túnel:
  #   cloudflared tunnel route dns 12675577-d94b-4a19-b1df-a86713dbaf80 status.getgymsite.com.br
  - hostname: status.getgymsite.com.br
    service: http://uptime-kuma:3001
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      http2Origin: false
      noTLSVerify: true

  - service: http_status:404
