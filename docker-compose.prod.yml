# =============================================================================
# GymSite Intelligence — Production Compose
# Pulls image from GHCR; includes Redis + rolling deploy support
# =============================================================================
version: '3.8'

services:
  api:
    image: ${GHCR_IMAGE:-ghcr.io/marce/gymsite_intelligence:latest}
    container_name: gymsite-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # Bind localhost only — nginx/cloudflared reverse proxy
    volumes:
      - ${CNO_DATA_DIR_HOST:-./cno_data}:/data/cno:ro
      - pip_cache:/home/appuser/.cache/pip:rw
      - playwright_cache:/home/appuser/.local/share/ms-playwright:rw
    env_file:
      - .env.production
    environment:
      LOG_LEVEL: info
      # Redis cache (habilitado se REDIS_URL presente)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 1
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gymsite

  redis:
    image: redis:7-alpine
    container_name: gymsite-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data:rw
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gymsite

  nginx:
    image: nginx:alpine
    container_name: gymsite-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx:rw
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gymsite
    profiles: ["nginx"]  # docker compose --profile nginx up -d

  # Cloudflare Tunnel — expõe a API via domínio sem abrir portas na VM.
  # O TLS é terminado no edge Cloudflare; o tunnel fala HTTP interno com a API.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gymsite-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gymsite

volumes:
  pip_cache:
    driver: local
  playwright_cache:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  gymsite:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
