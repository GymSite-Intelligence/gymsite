[pytest]
# Sem isso, pytest-asyncio >=0.21 roda em modo `strict` e todo `async def test_`
# sem marcador FALHA em vez de rodar. Os testes de cap de chat (188be38) ficaram
# vermelhos e invisíveis por isso — cobertura fantasma.
asyncio_mode = auto
testpaths = tests tools pdf models
norecursedirs = .venv node_modules frontend dist metrics .git

# Warnings — ver https://docs.pytest.org/en/stable/how-to/capture-warnings.html
# Último filtro que casa vence. Não usamos `error` global ainda: ADK/OTel geram
# DeprecationWarning na importação; falhar o suite inteiro por isso atrapalha.
# Processo:
#   1) mock/unit = default (rápido, sem rede)
#   2) dados reais = -m integration (precisa .env SUPABASE)
#   3) warning NOSSO código = corrigir; warning TERCEIRO conhecido = ignore abaixo
#   4) ver warning novo → decidir ignore (terceiro) ou fix (nosso)
filterwarnings =
    ignore:SelectableGroups dict interface is deprecated:DeprecationWarning
    ignore:BaseAgentConfig is deprecated:DeprecationWarning
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning

markers =
    e2e: end-to-end gate (bundle, DR skip, viabilidade; sem API ADK completa)
    integration: precisa .env/rede/DB (ex.: CNPJ Supabase); não mock
