<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var k = 'gymsite-theme'
          var t = localStorage.getItem(k)
          var id = t === 'claro' || t === 'light' ? 'claro' : 'escuro'
          var d = document.documentElement
          d.setAttribute('data-theme', id)
          if (id === 'escuro') {
            d.classList.add('dark')
            d.style.colorScheme = 'dark'
          } else {
            d.classList.remove('dark')
            d.style.colorScheme = 'light'
          }
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/gymsite-logo-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>GymSite Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
