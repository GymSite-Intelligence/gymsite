<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fundo de Grade Blueprint -->
  <rect width="100%" height="100%" fill="#f0f9ff" />
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250 M 0 300 L 500 300 M 0 350 L 500 350 M 0 400 L 500 400 M 0 450 L 500 450" stroke="#bae6fd" stroke-width="1.5" />
  <path d="M 50 0 L 50 500 M 100 0 L 100 500 M 150 0 L 150 500 M 200 0 L 200 500 M 250 0 L 250 500 M 300 0 L 300 500 M 350 0 L 350 500 M 400 0 L 400 500 M 450 0 L 450 500" stroke="#bae6fd" stroke-width="1.5" />

  <!-- Pino de Localização (Fundo do Agente) -->
  <path d="M 250 40 C 134 40 40 134 40 250 C 40 350 250 460 250 460 L 250 40 Z" fill="#84cc16" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
  <path d="M 250 40 C 366 40 460 134 460 250 C 460 350 250 460 250 460 L 250 40 Z" fill="#1e293b" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
  <path d="M 250 70 C 156 70 80 146 80 240 C 80 310 250 410 250 410" fill="none" stroke="#bef264" stroke-width="6" stroke-linecap="round" />
  <path d="M 250 70 C 344 70 420 146 420 240 C 420 310 250 410 250 410" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Robô Mascot -->
  <circle cx="250" cy="200" r="60" fill="#f8fafc" stroke="#0f172a" stroke-width="7" />
  <path d="M 250 140 C 283 140 310 167 310 200 C 310 233 283 260 250 260 Z" fill="#475569" stroke="#0f172a" stroke-width="3" />
  <rect x="180" y="180" width="12" height="40" rx="6" fill="#84cc16" stroke="#0f172a" stroke-width="6" />
  <rect x="308" y="180" width="12" height="40" rx="6" fill="#84cc16" stroke="#0f172a" stroke-width="6" />
  <circle cx="220" cy="195" r="10" fill="#22c55e" stroke="#0f172a" stroke-width="4" />
  <circle cx="280" cy="195" r="10" fill="#22c55e" stroke="#0f172a" stroke-width="4" />
  <path d="M 235 225 Q 250 235 265 225" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <path d="M 250 140 L 250 165" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
  <circle cx="250" cy="170" r="4" fill="#22c55e" />

  <!-- Corpo do Robô -->
  <path d="M 190 290 Q 250 270 310 290 L 290 380 Q 250 400 210 380 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="7" />
  <path d="M 250 276 Q 280 285 290 380 Q 250 400 250 400 Z" fill="#475569" stroke="#0f172a" stroke-width="3" />
  <circle cx="250" cy="320" r="15" fill="#22c55e" stroke="#0f172a" stroke-width="4" />

  <!-- Braços -->
  <path d="M 190 300 Q 140 320 160 370" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
  <path d="M 310 300 Q 360 320 350 360" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />

  <!-- ITEMS DO ARQUITETO -->
  <!-- Esquadro (Mão Esquerda / Lado Direito da Imagem) -->
  <g transform="translate(325, 310)">
    <polygon points="0,50 50,50 0,0" fill="#22c55e" opacity="0.9" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
    <polygon points="8,42 32,42 8,18" fill="#f0f9ff" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- Prancheta (Mão Direita / Lado Esquerdo da Imagem) -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="55" height="75" rx="5" fill="#d97706" stroke="#0f172a" stroke-width="5" />
    <rect x="5" y="10" width="45" height="60" fill="#ffffff" />
    <!-- Clip de Metal -->
    <path d="M 15 0 L 40 0 L 35 10 L 20 10 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
    <!-- Linhas de Desenho na Prancheta -->
    <line x1="10" y1="20" x2="45" y2="20" stroke="#bae6fd" stroke-width="2" />
    <line x1="10" y1="30" x2="45" y2="30" stroke="#bae6fd" stroke-width="2" />
    <line x1="10" y1="40" x2="45" y2="40" stroke="#bae6fd" stroke-width="2" />
    <path d="M 15 25 L 35 55 L 42 45" fill="none" stroke="#84cc16" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
