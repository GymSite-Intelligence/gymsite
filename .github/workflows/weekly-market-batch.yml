# Batch semanal — SUBSTITUÍDO por Supabase pg_cron + pg_net → Cloud Run worker.
# Mantido só para rerun manual de emergência (workflow_dispatch).
#
# Canônico: db/migrations/20260727_market_batch_supabase_cron.sql
#             POST /api/internal/cron/weekly-market-batch (gymsite-worker)

name: Weekly Market Batch (manual fallback)

on:
  workflow_dispatch:
    inputs:
      only_cvm:
        description: "Só CVM + benchmarks (sem bundles)"
        type: boolean
        default: false

jobs:
  weekly-batch:
    name: Manual weekly batch (legacy GHA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write Vertex service-account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"

      - name: Run weekly batch
        env:
          MARKET_BUNDLE_SUPABASE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GYMSITE_SCHEMA_SEP: "1"
          SHARED_SCHEMA_SEP: "1"
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: gen-lang-client-0106729343
          GOOGLE_CLOUD_LOCATION: global
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
        run: |
          ARGS="--skip-enrichment"
          if [ "${{ github.event.inputs.only_cvm }}" = "true" ]; then
            ARGS="$ARGS --only-cvm"
          fi
          python scripts/batch/run_weekly_market_batch.py $ARGS
