# Job GitHub Actions para execução diária do benchmark de frete
#
# Executa automaticamente às 06:00 UTC (03:00 BRT) todos os dias úteis.
# Ajusta automaticamente o número de destinos baseado na taxa de falhas
# anterior para evitar sobrecarga da API.
#
# Requisitos:
# - Secret GOOGLE_DISTANCE_MATRIX_API_KEY configurada no repositório
# - Permissão de push para committer do benchmark (github-actions[bot])

name: Benchmark Diário de Frete ANTT

on:
  schedule:
    # Executa às 06:00 UTC (03:00 BRT) todos os dias
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fornecedores:
        description: "Fornecedores específicos (separados por vírgula)"
        required: false
        default: ""
      destinos:
        description: "Destinos específicos (separados por vírgula)"
        required: false
        default: ""
      tipo_carga:
        description: "Tipo de carga"
        required: false
        default: "carga_geral"
        type: choice
        options:
          - carga_geral
          - fracionado
          - lotacao
          - expresso

permissions:
  contents: write

jobs:
  benchmark-frete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Para comparar com benchmark anterior

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instala googlemaps se não estiver em requirements.txt
          pip install googlemaps || true

      - name: Verificar cache de benchmark anterior
        id: previous
        run: |
          if [ -f data/frete_benchmark.json ]; then
            TOTAL=$(python -c "import json; d=json.load(open('data/frete_benchmark.json')); print(d['meta']['total_rotas'])")
            FALHAS=$(python -c "import json; d=json.load(open('data/frete_benchmark.json')); print(d['meta']['rotas_falha'])")
            TAXA_FALHA=$(python -c "total=$TOTAL; falhas=$FALHAS; print(round(falhas/total*100, 1) if total > 0 else 0)")
            echo "total_rotas=$TOTAL" >> $GITHUB_OUTPUT
            echo "falhas=$FALHAS" >> $GITHUB_OUTPUT
            echo "taxa_falha=$TAXA_FALHA" >> $GITHUB_OUTPUT
            echo "::notice::Benchmark anterior: $TOTAL rotas, $FALHAS falhas ($TAXA_FALHA%)"
          else
            echo "total_rotas=0" >> $GITHUB_OUTPUT
            echo "falhas=0" >> $GITHUB_OUTPUT
            echo "taxa_falha=0" >> $GITHUB_OUTPUT
            echo "::notice::Nenhum benchmark anterior encontrado"
          fi

      - name: Ajustar escopo baseado em falhas anteriores
        id: scope
        run: |
          TAXA_FALHA="${{ steps.previous.outputs.taxa_falha }}"
          # Se taxa de falha > 30%, reduzir destinos para principais
          if (( $(echo "$TAXA_FALHA > 30" | bc -l) )); then
            echo "::warning::Taxa de falha alta ($TAXA_FALHA%). Reduzindo para destinos principais."
            echo "destinos=--destinos fortaleza_ce recife_pe salvador_ba brasilia_df curitiba_pr" >> $GITHUB_OUTPUT
          else
            echo "destinos=" >> $GITHUB_OUTPUT
          fi

      - name: Executar benchmark
        env:
          GOOGLE_DISTANCE_MATRIX_API_KEY: ${{ secrets.GOOGLE_DISTANCE_MATRIX_API_KEY }}
          # Dados controláveis pelo usuário entram como env (não interpolados no shell)
          # para evitar script injection — semgrep run-shell-injection.
          SCOPE_DESTINOS: ${{ steps.scope.outputs.destinos }}
          IN_TIPO_CARGA: ${{ github.event.inputs.tipo_carga }}
          IN_FORNECEDORES: ${{ github.event.inputs.fornecedores }}
          IN_DESTINOS: ${{ github.event.inputs.destinos }}
        run: |
          # Prepara argumentos (lendo de env, nunca de ${{ }} dentro do shell)
          FORNECEDORES=""
          DESTINOS="$SCOPE_DESTINOS"
          TIPO_CARGA="${IN_TIPO_CARGA:-carga_geral}"

          if [ -n "$IN_FORNECEDORES" ]; then
            FORNECEDORES="--fornecedores $IN_FORNECEDORES"
          fi

          if [ -n "$IN_DESTINOS" ]; then
            DESTINOS="--destinos $IN_DESTINOS"
          fi

          # Executa benchmark
          python tools/frete_benchmark.py \
            $FORNECEDORES \
            $DESTINOS \
            --tipo-carga "$TIPO_CARGA" \
            --output data/frete_benchmark.json

      - name: Validar resultado
        run: |
          python -c "
          import json, sys
          with open('data/frete_benchmark.json') as f:
              data = json.load(f)
          if data['meta']['rotas_sucesso'] == 0:
              print('ERRO: Nenhuma rota executada com sucesso!')
              sys.exit(1)
          print(f\"OK: {data['meta']['rotas_sucesso']}/{data['meta']['total_rotas']} rotas\")
          "

      - name: Commitar benchmark
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/frete_benchmark.json
          # Commita apenas se houver mudanças
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no benchmark"
          else
            git commit -m "chore: atualiza benchmark de frete ANTT ($(date +%Y-%m-%d))"
            git push
          fi

      - name: Upload de artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frete-benchmark-$(date +%Y-%m-%d)
          path: data/frete_benchmark.json
          retention-days: 30

      - name: Notificar falhas
        if: failure()
        run: |
          echo "::error::Benchmark de frete falhou. Verifique logs e API key."
          # Aqui pode adicionar integração com Slack, Discord, etc.
