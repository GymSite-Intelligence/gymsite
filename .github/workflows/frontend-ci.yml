# =============================================================================
# Frontend CI — valida PR antes do merge (evita checks amarelos acumulados no deploy)
# =============================================================================
name: Frontend CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/pages.yml'

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Production build (smoke)
        working-directory: frontend
        env:
          VITE_USE_MOCKS: 'false'
          # Placeholders — segredos reais só no workflow de deploy
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-only
          VITE_API_BASE: https://gymsite-api.vectracargo.com.br
          VITE_DEV_AS_ADMIN: 'false'
        run: npm run build

      - name: Verify SPA assets
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/_redirects || grep -q '/*' frontend/public/_redirects
