# =============================================================================
# GymSite Intelligence — Frontend → Cloudflare Pages (GYM-03)
# Projeto: gymsite-3p0 | Domínio: gymsite.vectracargo.com.br
# =============================================================================
name: Deploy Frontend (Cloudflare Pages)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_USE_MOCKS: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE: https://gymsite-api.vectracargo.com.br
          VITE_DEV_AS_ADMIN: 'false'
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=gymsite-3p0 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check (pages.dev)
        run: |
          echo "=== Verificando deploy em https://gymsite-3p0.pages.dev ==="
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://gymsite-3p0.pages.dev/ || echo "000")
            echo "Tentativa $i: HTTP $status"
            if [ "$status" = "200" ] || [ "$status" = "304" ]; then
              echo "✅ Deploy OK"
              exit 0
            fi
            sleep 5
          done
          echo "⚠️ Deploy não respondeu 200. Verifique o dashboard do Cloudflare Pages."
          exit 1
