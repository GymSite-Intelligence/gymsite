# =============================================================================
# GymSite Intelligence — CI/CD Pipeline
# Build → Test → Push (GHCR) → Deploy (VPS ou GCE)
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COMPOSE_FILE: docker-compose.prod.yml
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # CI — Build, lint, test
  # ═══════════════════════════════════════════════════════════════════════════
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check api.py agents/ pdf/ prospecting/ models/ || true

      - name: Type check (mypy)
        run: |
          pip install mypy types-requests
          mypy api.py --ignore-missing-imports || true

      # Contratos do pipeline: .github/workflows/pipeline-gate.yml (required check)

      - name: Free disk space (Docker/Playwright build headroom)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: gymsite-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Trivy scan (fixable CRITICAL/HIGH must be zero)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gymsite-api:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Smoke tests in image (deterministic)
        run: |
          docker run --rm gymsite-api:test python scripts/smoke_a9_langcache_e2e.py --ci-mode
          docker run --rm gymsite-api:test python scripts/test_a9_integration.py

      - name: Smoke test container (API up + health)
        run: |
          docker run -d --name gymsite-smoke -p 8000:8000 --env-file .env.production.example gymsite-api:test
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/health; then
              curl -sf "http://localhost:8000/health?probe=0" | head -c 500
              docker stop gymsite-smoke
              exit 0
            fi
            sleep 5
          done
          docker logs gymsite-smoke
          docker stop gymsite-smoke || true
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # Eval — Golden dataset (determinístico, sem CNO raw / Supabase)
  # ═══════════════════════════════════════════════════════════════════════════
  eval-golden-dataset:
    name: Golden Dataset Eval
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run golden dataset eval (CNO consistency)
        run: python eval/run_eval.py

  # ═══════════════════════════════════════════════════════════════════════════
  # CD — Push to GHCR + Deploy
  # ═══════════════════════════════════════════════════════════════════════════
  cd:
    name: Push & Deploy
    needs: [ci, eval-golden-dataset]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_VM_NAME: ${{ secrets.GCP_VM_NAME }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64

      # ─── Deploy para VPS genérico (SSH direto) ────────────────────────────
      - name: Deploy to VPS
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.0
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ~/gymsite_intelligence || cd /opt/gymsite
            
            # Pull latest images
            docker compose -f ${{ env.COMPOSE_FILE }} pull
            
            # Rolling deploy with health check
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --no-deps --scale api=2 api
            sleep 15
            
            # Verify health on both containers
            for c in $(docker compose -f ${{ env.COMPOSE_FILE }} ps -q api); do
              docker exec "$c" python -c \
                "import httpx; r=httpx.get('http://127.0.0.1:8000/health', timeout=5); assert r.status_code==200" \
                || (echo "Health check failed for $c" && exit 1)
            done
            
            # Scale back to 1 (rolling complete)
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --no-deps --scale api=1 api
            
            # Cleanup
            docker system prune -f
            echo "Deploy completed at $(date)"

      # ─── Deploy para GCE (via gcloud + IAP) ───────────────────────────────
      - name: Deploy to GCE
        if: ${{ env.GCP_SA_KEY != '' && env.GCP_VM_NAME != '' }}
        run: |
          # Instala gcloud
          curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=$HOME
          export PATH="$HOME/google-cloud-sdk/bin:$PATH"
          
          # Autentica
          echo '${{ secrets.GCP_SA_KEY }}' | gcloud auth activate-service-account --key-file=-
          gcloud config set project ${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0106729343' }}
          
          # Obtém IP externo da VM
          VM_IP=$(gcloud compute instances describe ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE || 'southamerica-east1-a' }} \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')
          
          echo "Deploying to GCE VM at $VM_IP..."
          
          # Deploy via SSH
          mkdir -p ~/.ssh
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER || 'ubuntu' }}@$VM_IP \
            "cd /opt/gymsite && bash scripts/deploy.sh ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {"text": "🚨 *GymSite API deploy failed*\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
