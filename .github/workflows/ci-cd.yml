# =============================================================================
# GymSite Intelligence — CI/CD Pipeline
# Build → Test → Push (GHCR) → Deploy (Hetzner VPS)
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COMPOSE_FILE: docker-compose.prod.yml
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # CI — Build, lint, test
  # ═══════════════════════════════════════════════════════════════════════════
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check api.py agents/ pdf/ prospecting/ models/ || true

      - name: Type check (mypy)
        run: |
          pip install mypy types-requests
          mypy api.py --ignore-missing-imports || true

      # Contratos do pipeline: .github/workflows/pipeline-gate.yml (required check)

      - name: Free disk space (Playwright/system deps need headroom)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: gymsite-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke tests in image (deterministic)
        run: |
          docker run --rm gymsite-api:test python scripts/smoke_a9_langcache_e2e.py --ci-mode
          docker run --rm gymsite-api:test python scripts/test_a9_integration.py

      - name: Smoke test container (API up + health)
        run: |
          docker run -d --name gymsite-smoke -p 8000:8000 --env-file .env.production.example gymsite-api:test
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/health; then
              curl -sf "http://localhost:8000/health?probe=0" | head -c 500
              docker stop gymsite-smoke
              exit 0
            fi
            sleep 5
          done
          docker logs gymsite-smoke
          docker stop gymsite-smoke || true
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # Eval — Golden dataset (determinístico, sem CNO raw / Supabase)
  # ═══════════════════════════════════════════════════════════════════════════
  eval-golden-dataset:
    name: Golden Dataset Eval
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run golden dataset eval (CNO consistency)
        run: python eval/run_eval.py

  # ═══════════════════════════════════════════════════════════════════════════
  # CD — Push to GHCR + Deploy
  # ═══════════════════════════════════════════════════════════════════════════
  cd:
    name: Push & Deploy
    needs: [ci, eval-golden-dataset]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64

      # ─── Deploy para VPS (SSH nativo — appleboy/ssh-action quebra no runner Node 24) ─
      - name: Deploy to VPS
        if: ${{ env.SSH_HOST != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" -i ~/.ssh/id_ed25519 \
            "${SSH_USER}@${SSH_HOST}" <<'REMOTE'
          set -euo pipefail
          cd /opt/gymsite
          docker compose -f docker-compose.prod.yml pull api worker
          docker compose -f docker-compose.prod.yml up -d api worker
          docker compose -f docker-compose.prod.yml ps
          docker exec "$(docker compose -f docker-compose.prod.yml ps -q api | head -1)" \
            python -c "import httpx; r=httpx.get('http://127.0.0.1:8000/health', timeout=5); assert r.status_code==200"
          echo "Deploy completed at $(date)"
          REMOTE

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {"text": "🚨 *GymSite API deploy failed*\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
